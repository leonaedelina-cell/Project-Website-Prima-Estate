<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile — Estate Prima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="d-flex">
        <div class="sidebar-estate p-3 d-flex flex-column flex-shrink-0">
            <a href="index.html" class="d-flex align-items-center gap-2 mb-1 text-white text-decoration-none fs-5 fw-bold">
                <i class="bi bi-house-door-fill text-gold"></i> Estate Prima
            </a>
            <div class="text-white-50 small mb-3">Dashboard User</div>
            <hr class="mt-0 border-secondary">
            <ul class="nav nav-pills flex-column gap-1 mb-auto">
                <li class="nav-item"><a href="index.html" class="nav-link"><i class="bi bi-house me-1"></i> Kembali ke Home</a></li>
                <li><hr class="border-secondary my-2"></li>
                <li class="nav-item"><a href="dashboard-user.html" class="nav-link"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                <li class="nav-item"><a href="wishlist.html" class="nav-link"><i class="bi bi-heart me-1"></i> Wishlist Saya</a></li>
                <li class="nav-item"><a href="pesanan.html" class="nav-link"><i class="bi bi-bag-check me-1"></i> Pesanan Saya</a></li>
                <li class="nav-item"><a href="profil.html" class="nav-link active"><i class="bi bi-person-gear me-1"></i> Edit Profile</a></li>
            </ul>
            <hr class="border-secondary">
            <a href="index.html" class="btn btn-outline-danger btn-sm d-flex align-items-center justify-content-center gap-1">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>

        <main class="flex-grow-1 p-4" style="max-width: 700px;">
            <h1 class="h3 mb-1"><i class="bi bi-person-gear"></i> Edit Profile</h1>
            <p class="text-muted mb-4">Ganti username, no. WhatsApp, atau password akun kamu.</p>

            <div class="alert alert-success d-flex align-items-center gap-2"><i class="bi bi-check-circle"></i> Username berhasil diubah.</div>

            <!-- Card 1: Ganti Username & No. HP -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">
                    <h2 class="h5 mb-3"><i class="bi bi-person"></i> Info Akun</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" value="vanya">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">No. WhatsApp</label>
                            <input type="text" class="form-control" value="081234567890">
                        </div>
                        <button type="submit" class="btn text-white" style="background-color:#16324f;">Simpan Info Akun</button>
                    </form>
                </div>
            </div>

            <!-- Card 2: Ganti Password -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h5 mb-3"><i class="bi bi-lock"></i> Password</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Password Lama</label>
                            <input type="password" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password Baru</label>
                            <input type="password" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Konfirmasi Password Baru</label>
                            <input type="password" class="form-control">
                        </div>
                        <button type="submit" class="btn text-white" style="background-color:#16324f;">Simpan Password</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
