<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register — Estate Prima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row" style="min-height: 100vh;">
            <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center text-white p-5 hero-estate">
                <i class="bi bi-buildings" style="font-size: 8rem; opacity: 0.35;"></i>
                <h2 class="fw-bold mt-4">Gabung Sekarang</h2>
                <p class="text-white-50 text-center" style="max-width: 380px;">Daftar gratis, wishlist properti favorit, dan ajukan beli/sewa kapan aja.</p>
            </div>

            <div class="col-lg-6 d-flex align-items-center justify-content-center p-4 bg-light">
                <div style="width: 100%; max-width: 380px;">
                    <a href="index.html" class="text-decoration-none text-muted small d-inline-flex align-items-center gap-1 mb-4">
                        <i class="bi bi-arrow-left"></i> Kembali ke Home
                    </a>

                    <h1 class="h3 fw-bold mb-1 text-navy">Buat Akun Baru</h1>
                    <p class="text-muted mb-4">Isi form di bawah buat daftar.</p>

                    <form>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" placeholder="Pilih username">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">No. WhatsApp</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-whatsapp"></i></span>
                                <input type="text" class="form-control" placeholder="08xxxxxxxxxx">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" placeholder="Minimal 6 karakter">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Konfirmasi Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" placeholder="Ulangi password">
                            </div>
                        </div>
                        <a href="login.html" class="btn w-100 py-2 d-flex align-items-center justify-content-center gap-2 text-white" style="background-color:#16324f;">
                            <i class="bi bi-person-plus"></i> Daftar
                        </a>
                    </form>

                    <p class="text-center mt-4 mb-0 text-muted">
                        Sudah punya akun? <a href="login.html" class="fw-semibold text-decoration-none">Login di sini</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
